name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true
        default: v6.9.5
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew launcherVersion build --no-daemon

      - name: Check files
        run: |
            echo "=== Checking release files ==="
            ls -la build/launcher/Rise/ || true
            find build -name "Rise.jar" || true
            find build -name "*.jar" | head -10

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Rise ${{ inputs.tag }}
          body: put it in versions\Rise then start it up
          files: |
            build/launcher/Rise/Rise.jar
            build/launcher/Rise/Rise.json
